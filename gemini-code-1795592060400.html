<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMS - ระบบหยิบและแพ็กสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #print-label, #print-label * { visibility: visible; }
      #print-label { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; padding: 20px; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold">ระบบจัดการคลังสินค้า (Picking & Packing)</h1>
        <p class="text-sm text-slate-500">จัดการคำสั่งซื้อจาก Google Sheets แบบเรียลไทม์</p>
      </div>
      <a href="index.html" class="bg-white px-4 py-2 rounded-lg shadow-sm text-sm font-medium hover:bg-slate-50">← กลับหน้าร้าน</a>
    </div>

    <!-- Tabs -->
    <div class="flex space-x-2 mb-6">
      <button onclick="filterTab('PENDING')" class="tab-btn bg-amber-500 text-white px-4 py-2 rounded-lg font-semibold">1. รอหยิบสินค้า (Picking)</button>
      <button onclick="filterTab('PICKED')" class="tab-btn bg-white text-slate-700 px-4 py-2 rounded-lg font-semibold">2. รอแพ็กพัสดุ (Packing)</button>
      <button onclick="filterTab('PACKED')" class="tab-btn bg-white text-slate-700 px-4 py-2 rounded-lg font-semibold">3. แพ็กเสร็จแล้ว (Ready to Ship)</button>
    </div>

    <div id="orders-container" class="space-y-4">กำลังโหลดข้อมูลคำสั่งซื้อ...</div>
  </div>

  <!-- พื้นที่สำหรับพิมพ์ใบปะหน้าพัสดุ -->
  <div id="print-label" class="hidden"></div>

  <script>
    let allOrders = [];
    let currentTab = 'PENDING';

    async function loadOrders() {
      const res = await fetch(`${API_URL}?action=getOrders`);
      const json = await res.json();
      allOrders = json.data;
      renderOrders();
    }

    function filterTab(status) {
      currentTab = status;
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById('orders-container');
      const filtered = allOrders.filter(o => o.status === currentTab);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400">ไม่มีรายการในสถานะ ${currentTab}</div>`;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const items = JSON.parse(order.items_json || '[]');
        return `
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <div class="flex flex-wrap justify-between items-start border-b pb-4 mb-4">
              <div>
                <span class="font-bold text-lg text-teal-700">${order.order_id}</span>
                <span class="text-xs text-slate-400 ml-2">${order.timestamp}</span>
                <p class="font-medium mt-1">ลูกค้า: ${order.customer_name} (${order.phone})</p>
                <p class="text-sm text-slate-600">ที่อยู่: ${order.address}</p>
              </div>
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100">${order.status}</span>
            </div>

            <!-- รายการสินค้า (Picking / Packing Checklist) -->
            <div class="bg-slate-50 p-4 rounded-lg mb-4">
              <h4 class="text-xs font-bold uppercase text-slate-500 mb-2">รายการสินค้าที่ต้องจัดเตรียม:</h4>
              <div class="space-y-2">
                ${items.map((item, idx) => `
                  <label class="flex items-center justify-between bg-white p-3 rounded border">
                    <div class="flex items-center space-x-3">
                      <input type="checkbox" class="chk-${order.order_id} w-5 h-5 accent-teal-600">
                      <div>
                        <span class="font-bold text-slate-800">[${item.sku}] ${item.name}</span>
                        <span class="block text-xs text-amber-600 font-semibold">ตำแหน่งจัดเก็บ: ${item.location || 'Shelf A1'}</span>
                      </div>
                    </div>
                    <span class="text-lg font-extrabold bg-teal-50 text-teal-700 px-3 py-1 rounded">จำนวน: ${item.qty} ชิ้น</span>
                  </label>
                `).join('')}
              </div>
            </div>

            <!-- ปุ่มดำเนินการตามขั้นตอน -->
            <div class="flex flex-wrap gap-3 justify-end items-center">
              ${currentTab === 'PENDING' ? `
                <button onclick="confirmPick('${order.order_id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2 rounded-lg">
                  ✓ ยืนยันหยิบสินค้าครบแล้ว (ไปขั้นตอนแพ็ก)
                </button>
              ` : ''}

              ${currentTab === 'PICKED' ? `
                <input type="text" id="track-${order.order_id}" placeholder="กรอกเลขพัสดุ (Tracking No.)" class="border rounded-lg px-3 py-2 text-sm">
                <button onclick="confirmPack('${order.order_id}')" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-5 py-2 rounded-lg">
                  ✓ ตรวจสอบถูกต้อง & แพ็กเสร็จสิ้น
                </button>
              ` : ''}

              ${currentTab === 'PACKED' ? `
                <span class="text-sm font-semibold text-slate-600">Tracking: ${order.tracking_number || '-'}</span>
                <button onclick='printShippingLabel(${JSON.stringify(order)})' class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-5 py-2 rounded-lg">
                  🖨️ พิมพ์ใบปะหน้าพัสดุ
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function allChecked(orderId) {
      const checkboxes = document.querySelectorAll(`.chk-${orderId}`);
      return Array.from(checkboxes).every(cb => cb.checked);
    }

    async function confirmPick(orderId) {
      if (!allChecked(orderId)) return alert('กรุณาติ๊กถูกที่รายการสินค้าให้ครบทุก SKU ก่อนยืนยันการหยิบ!');
      await updateStatus(orderId, 'PICKED');
    }

    async function confirmPack(orderId) {
      if (!allChecked(orderId)) return alert('กรุณาตรวจสอบและติ๊กถูกสินค้าทุกชิ้นลงกล่องให้ครบถ้วนก่อนแพ็ก!');
      const tracking = document.getElementById(`track-${orderId}`).value;
      await updateStatus(orderId, 'PACKED', tracking);
    }

    async function updateStatus(orderId, status, tracking = '') {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updateOrderStatus', order_id: orderId, status: status, tracking_number: tracking })
      });
      alert(`อัปเดตสถานะ ${orderId} เป็น ${status} เรียบร้อย`);
      loadOrders();
    }

    function printShippingLabel(order) {
      const items = JSON.parse(order.items_json || '[]');
      const labelDiv = document.getElementById('print-label');
      labelDiv.classList.remove('hidden');
      labelDiv.innerHTML = `
        <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 10px;">ใบปะหน้าพัสดุ - PUREBRUSH</h2>
        <p><strong>Order ID:</strong> ${order.order_id} | <strong>Tracking:</strong> ${order.tracking_number || 'N/A'}</p>
        <hr style="margin: 10px 0;">
        <p><strong>ผู้รับ:</strong> ${order.customer_name}</p>
        <p><strong>โทร:</strong> ${order.phone}</p>
        <p><strong>ที่อยู่จัดส่ง:</strong> ${order.address}</p>
        <hr style="margin: 10px 0;">
        <p><strong>รายการสินค้าในกล่อง:</strong></p>
        <ul>${items.map(i => `<li>- [${i.sku}] ${i.name} (จำนวน ${i.qty} ชิ้น)</li>`).join('')}</ul>
      `;
      window.print();
      labelDiv.classList.add('hidden');
    }

    loadOrders();
  </script>
</body>
</html>
